# publications.claritasz.com · Netlify configuration

# The pages are built from the folders on every push (see build.py).
[build]
  command = "python3 build.py"
  publish = "."
# Reports moved from the root into reports/. Old paths keep working.

[[redirects]]
  from = "/de-businessarchitect/*"
  to = "/reports/de-businessarchitect/:splat"
  status = 301

[[redirects]]
  from = "/de-dataarchitect/*"
  to = "/reports/de-dataarchitect/:splat"
  status = 301

[[redirects]]
  from = "/de-enterprisearchitect/*"
  to = "/reports/de-enterprisearchitect/:splat"
  status = 301

[[redirects]]
  from = "/de-infrastructuurarchitect/*"
  to = "/reports/de-infrastructuurarchitect/:splat"
  status = 301

[[redirects]]
  from = "/de-integratiearchitect/*"
  to = "/reports/de-integratiearchitect/:splat"
  status = 301

[[redirects]]
  from = "/de-securityarchitect/*"
  to = "/reports/de-securityarchitect/:splat"
  status = 301

[[redirects]]
  from = "/sample/*"
  to = "/reports/sample/:splat"
  status = 301

# The root has no page of its own: Dutch browsers go to /nl/, everyone else to /en/.
[[redirects]]
  from = "/"
  to = "/nl/"
  status = 302
  force = true
  conditions = {Language = ["nl"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
